<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сравнение оружия — DayZ - Оружие</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14140f; --bg2:#1c1c15; --panel:#20201a; --border:#3a3a2c;
  --text:#e8e4d8; --muted:#a9a495; --accent:#c9a24b; --accent2:#7a8f5c;
  --danger:#b5493f; --link:#d9b96a;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Roboto,Arial,sans-serif; line-height:1.5;
}
a{color:var(--link); text-decoration:none;}
a:hover{text-decoration:underline;}
header.site{
  background:linear-gradient(180deg,#22221a,#181812);
  border-bottom:2px solid var(--border);
  padding:22px 28px;
}
header.site h1{margin:0; font-size:1.6rem; letter-spacing:.5px;}
header.site .sub{color:var(--muted); font-size:.9rem; margin-top:4px;}
.container{max-width:1200px; margin:0 auto; padding:24px 20px 60px;}
.back-link{display:inline-block; margin-bottom:16px; color:var(--muted); font-size:.9rem;}
.back-link:hover{color:var(--link);}

/* index table */
.controls{display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
.controls input[type=text]{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  padding:8px 12px; border-radius:6px; font-size:.95rem; min-width:240px;
}
.controls .count{color:var(--muted); font-size:.85rem;}
.cat-filter{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.cat-filter .chip{
  background:var(--panel); border:1px solid var(--border); color:var(--muted);
  padding:6px 14px; border-radius:20px; font-size:.85rem; cursor:pointer; user-select:none;
  transition:all .15s;
}
.cat-filter .chip:hover{border-color:var(--accent); color:var(--text);}
.cat-filter .chip.active{background:var(--accent); border-color:var(--accent); color:#1a1a12; font-weight:600;}
table.weapon-list{width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden;}
table.weapon-list th{
  text-align:left; padding:12px 14px; background:#26261d; border-bottom:2px solid var(--border);
  cursor:pointer; user-select:none; font-size:.9rem; white-space:nowrap; color:var(--accent);
}
table.weapon-list th .arrow{opacity:.4; font-size:.75em; margin-left:4px;}
table.weapon-list th.sorted .arrow{opacity:1;}
table.weapon-list td{padding:10px 14px; border-bottom:1px solid var(--border); font-size:.95rem;}
table.weapon-list tr:hover td{background:#26261b;}
.row-thumb{width:38px; height:38px; object-fit:contain; vertical-align:middle; margin-right:10px; background:#0f0f0c; border-radius:4px; border:1px solid var(--border);}
.name-cell{display:flex; align-items:center;}
.cat-badge{
  display:inline-block; padding:2px 9px; border-radius:20px; font-size:.78rem;
  background:#2c2c20; border:1px solid var(--border); color:var(--muted);
}
.dmg{color:var(--danger); font-variant-numeric:tabular-nums; font-weight:600;}

/* weapon detail page */
.weapon-hero{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:28px;}
.gallery{display:flex; flex-direction:column; gap:10px;}
.gallery .main-shot{
  width:494px; max-width:100%; height:494px; object-fit:contain; background:var(--panel);
  border:1px solid var(--border); border-radius:10px; padding:14px;
}
.gallery .thumbs{display:flex; gap:8px; flex-wrap:wrap;}
.gallery .thumbs img{
  width:76px; height:76px; object-fit:contain; background:var(--panel);
  border:1px solid var(--border); border-radius:6px; padding:6px; cursor:pointer;
}
.gallery .thumbs img:hover{border-color:var(--accent);}
.weapon-meta{flex:1; min-width:260px;}
.weapon-meta h1{margin:0 0 6px; font-size:1.9rem;}
.weapon-meta .cat-badge{margin-bottom:10px;}
.weapon-meta .desc{color:var(--muted); margin-top:10px; max-width:640px;}
.compare-box{margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.compare-box label{color:var(--accent); font-size:.9rem;}
.compare-box select{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:6px; font-size:.9rem; min-width:220px;
}

/* compare page */
.compare-heads{display:flex; gap:20px; max-width:900px; margin-bottom:24px; align-items:flex-end;}
.compare-head{
  flex:1; min-width:0; background:var(--panel); border:1px solid var(--border);
  border-radius:10px; padding:14px; text-align:center;
}
.compare-head img{width:110px; height:110px; object-fit:contain; background:#0f0f0c; border-radius:8px; padding:8px; margin-bottom:8px;}
.compare-head h2{margin:6px 0 4px; font-size:1.2rem;}
.compare-vs{
  display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  color:var(--accent); font-weight:700; padding-bottom:40px; min-width:30px;
}
.compare-swap{
  display:block; margin:0 auto 24px; background:var(--panel); border:1px solid var(--border);
  color:var(--link); padding:8px 16px; border-radius:6px; cursor:pointer; font-size:.85rem;
}
table.compare-table{width:100%; max-width:900px; border-collapse:collapse; background:var(--panel); border-radius:6px; overflow:hidden;}
table.compare-table th{text-align:left; padding:10px 14px; background:#26261d; font-size:.85rem; color:var(--accent);}
table.compare-table td{padding:9px 14px; border-bottom:1px solid var(--border); font-size:.93rem;}
table.compare-table td:first-child{color:var(--muted); width:34%;}
table.compare-table td.better{color:var(--accent2); font-weight:600;}
table.compare-table tr:last-child td{border-bottom:none;}
.compare-modlist{display:flex; flex-direction:column; gap:4px;}
.compare-modlist a{font-size:.9rem;}
.compare-picker{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; align-items:center;}
.compare-picker select{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:6px; font-size:.9rem; min-width:220px;
}

.section{margin-bottom:26px;}
.section h2{
  font-size:1.05rem; color:var(--accent); border-bottom:1px solid var(--border);
  padding-bottom:8px; margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
table.info-table{width:100%; max-width:640px; border-collapse:collapse; background:var(--panel); border-radius:6px; overflow:hidden;}
table.info-table td{padding:9px 14px; border-bottom:1px solid var(--border); font-size:.93rem;}
table.info-table td:first-child{color:var(--muted); width:55%;}
table.info-table tr:last-child td{border-bottom:none;}

table.economy-table{width:100%; max-width:900px; border-collapse:collapse; background:var(--panel); border-radius:6px; overflow:hidden;}
table.economy-table th{text-align:left; padding:9px 14px; background:#26261d; font-size:.85rem; color:var(--accent);}
table.economy-table td{padding:9px 14px; border-bottom:1px solid var(--border); font-size:.9rem;}
table.economy-table tr:last-child td{border-bottom:none;}

.module-grid{display:flex; flex-wrap:wrap; gap:14px;}
a.module-card{
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:12px; width:190px; display:flex; flex-direction:column; gap:6px;
  color:var(--text); text-decoration:none; transition:border-color .15s;
}
a.module-card:hover{border-color:var(--accent); text-decoration:none;}
.module-card img{
  width:100%; height:90px; object-fit:contain; background:#0f0f0c; border-radius:6px;
}
.module-card .m-name{font-size:.88rem; font-weight:600; color:var(--link);}
.module-card .m-desc{font-size:.78rem; color:var(--muted); flex:1;}
.module-card .m-stats{font-size:.76rem; color:var(--accent2);}

/* module (attachment) detail page */
.module-hero{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:28px; align-items:flex-start;}
.module-hero img{
  width:240px; height:240px; object-fit:contain; background:var(--panel);
  border:1px solid var(--border); border-radius:10px; padding:14px;
}
.compat-list{display:flex; flex-wrap:wrap; gap:10px;}
.compat-chip{
  display:flex; align-items:center; gap:8px; background:var(--panel);
  border:1px solid var(--border); border-radius:20px; padding:6px 14px 6px 6px;
  color:var(--text); font-size:.9rem;
}
.compat-chip:hover{border-color:var(--accent); text-decoration:none;}
.compat-chip img{width:28px; height:28px; object-fit:contain; border-radius:50%; background:#0f0f0c;}

footer.site{text-align:center; color:var(--muted); font-size:.8rem; padding:20px; border-top:1px solid var(--border);}
</style>
</head>
<body>
<header class="site">
  <h1>Сравнение оружия</h1>
  <div class="sub">DayZ - Оружие</div>
  <a class="nav-link" style="display:block;margin-top:8px;font-size:.85rem;" href="accessories.html">🔧 Приладдя →</a>

<div class="container">
  <a class="back-link" href="index.html">← Ко всему списку оружия</a>

  <div class="compare-picker">
    <select id="pickA"><option value="">Оружие 1...</option></select>
    <span style="color:var(--accent); font-weight:700;">vs</span>
    <select id="pickB"><option value="">Оружие 2...</option></select>
  </div>

  <div id="compareRoot"></div>
</div>
<footer class="site">Created by Dena</footer>
<script src="data.js"></script>
<script>
function qs(name){
  var m = new RegExp('[?&]'+name+'=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var byId = {};
WEAPONS_COMPARE_DATA.forEach(function(w){ byId[w.slug] = w; });

var pickA = document.getElementById('pickA');
var pickB = document.getElementById('pickB');
WEAPONS_COMPARE_DATA.forEach(function(w){
  var o1 = document.createElement('option'); o1.value = w.slug; o1.textContent = w.name; pickA.appendChild(o1);
  var o2 = document.createElement('option'); o2.value = w.slug; o2.textContent = w.name; pickB.appendChild(o2);
});

var slugA = qs('a'), slugB = qs('b');
pickA.value = slugA; pickB.value = slugB;

function navigate(){
  var a = pickA.value, b = pickB.value;
  if(a && b){ window.location.href = 'compare.html?a='+a+'&b='+b; }
}
pickA.addEventListener('change', navigate);
pickB.addEventListener('change', navigate);

function combinedRows(w){
  return (w.info || []).concat(w.characteristics || []);
}

function render(){
  var root = document.getElementById('compareRoot');
  var a = byId[slugA], b = byId[slugB];
  if(!a || !b){
    root.innerHTML = '<p style="color:var(--muted);">Выберите два вида оружия для сравнения.</p>';
    return;
  }
  var rowsA = combinedRows(a), rowsB = combinedRows(b);
  var mapA = {}; rowsA.forEach(function(p){ mapA[p[0]] = p[1]; });
  var mapB = {}; rowsB.forEach(function(p){ mapB[p[0]] = p[1]; });
  var labels = [];
  rowsA.forEach(function(p){ if(labels.indexOf(p[0]) === -1) labels.push(p[0]); });
  rowsB.forEach(function(p){ if(labels.indexOf(p[0]) === -1) labels.push(p[0]); });

  var html = '';
  html += '<div class="compare-heads">';
  html += '<div class="compare-head"><img src="'+(a.thumb ? 'images/'+a.thumb : '')+'" alt=""><h2><a href="weapons/'+a.slug+'.html">'+a.name+'</a></h2><span class="cat-badge">'+a.category+'</span></div>';
  html += '<div class="compare-vs">VS</div>';
  html += '<div class="compare-head"><img src="'+(b.thumb ? 'images/'+b.thumb : '')+'" alt=""><h2><a href="weapons/'+b.slug+'.html">'+b.name+'</a></h2><span class="cat-badge">'+b.category+'</span></div>';
  html += '</div>';

  html += '<table class="compare-table"><tr><th>Характеристика</th><th>'+a.name+'</th><th>'+b.name+'</th></tr>';
  labels.forEach(function(label){
    var va = mapA.hasOwnProperty(label) ? mapA[label] : '—';
    var vb = mapB.hasOwnProperty(label) ? mapB[label] : '—';
    html += '<tr><td>'+label+'</td><td>'+va+'</td><td>'+vb+'</td></tr>';
  });
  html += '</table>';

  var modA = a.modules || {}, modB = b.modules || {};
  var sections = [];
  Object.keys(modA).forEach(function(s){ if(sections.indexOf(s) === -1) sections.push(s); });
  Object.keys(modB).forEach(function(s){ if(sections.indexOf(s) === -1) sections.push(s); });

  function renderModList(items){
    if(!items || !items.length) return '<span style="color:var(--muted);">—</span>';
    return '<div class="compare-modlist">' + items.map(function(it){
      return '<a href="modules/'+it.slug+'.html">'+it.name+'</a>';
    }).join('') + '</div>';
  }

  if(sections.length){
    html += '<h2 style="font-size:1.05rem; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:8px; margin:26px 0 12px;">🧰 Обвес и модули</h2>';
    html += '<table class="compare-table"><tr><th>Категория</th><th>'+a.name+'</th><th>'+b.name+'</th></tr>';
    var icons = {"Ремонт":"🔧","Калибр":"🔘","Прицелы":"🎯","Приклады":"🪵","Дополнительные модули":"🧩","Магазины":"📦","Дульные модули":"🔫","Цевья":"🖐"};
    sections.forEach(function(section){
      html += '<tr><td>'+(icons[section] || '•')+' '+section+'</td><td>'+renderModList(modA[section])+'</td><td>'+renderModList(modB[section])+'</td></tr>';
    });
    html += '</table>';
  }

  root.innerHTML = html;
}
render();
</script>
</body>
</html>
